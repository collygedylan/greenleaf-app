<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greenleaf Pro v125 (Drill-Down Fix)</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --brand-green: #007a4d; --brand-gold: #e3a000; --text-main: #111827; }
        body { font-family: "Amazon Ember", Arial, sans-serif; background-color: white; color: var(--text-main); overscroll-behavior-y: none; }
        .nav-header { background: var(--brand-green); color: white; padding-top: env(safe-area-inset-top); }
        
        #view-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--brand-green); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 360px; text-align: center; }
        .user-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #e5e7eb; border-radius: 8px; font-weight: 700; color: #374151; background: white; display: flex; align-items: center; gap: 10px; }
        .pin-input { width: 100%; padding: 14px; font-size: 24px; text-align: center; letter-spacing: 4px; border: 2px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; outline: none; display: none; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #007a4d; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #side-drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 2000; box-shadow: 2px 0 10px rgba(0,0,0,0.2); transition: left 0.3s ease-in-out; display: flex; flex-direction: column; }
        #side-drawer.open { left: 0; }
        #drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1999; display: none; }
        #drawer-overlay.open { display: block; }
        .drawer-header { background: var(--brand-green); color: white; padding: 20px; font-weight: bold; }
        .drawer-item { padding: 16px 20px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; align-items: center; gap: 12px; color: #374151; font-weight: 500; }

        .drill-item { border-bottom: 1px solid #e5e7eb; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: white; }
        .inv-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 10px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .task-user-btn { background: white; border: 1px solid #e5e7eb; border-left: 4px solid var(--brand-green); border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 10px; }
        .back-btn { display: flex; align-items: center; gap: 5px; color: #6b7280; font-size: 14px; font-weight: 600; margin-bottom: 15px; cursor: pointer; padding: 5px 0; }

        .detail-tabs { display: flex; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
        .detail-tab { flex: 1; text-align: center; padding: 14px; font-size: 13px; font-weight: 700; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; }
        .detail-tab.active { color: var(--brand-green); border-bottom-color: var(--brand-green); background: white; }
        
        .expand-trigger { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f9fafb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid #e5e7eb; margin-top: 10px; }
        .expand-content { display: none; margin-top: 12px; padding: 12px; background: #f9fafb; border-radius: 6px; }
        .expanded .expand-content { display: block; }
        .dynamic-stack { margin-bottom: 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
        .dynamic-label { font-size: 10px; color: #6b7280; font-weight: 800; text-transform: uppercase; }
        .dynamic-val { font-size: 14px; color: #111827; font-weight: 500; }

        .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .overview-card { background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .overview-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .overview-val { font-size: 13px; font-weight: 600; color: #0f172a; }
        .full-width { grid-column: span 2; }

        .input-field { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background-color: #fff; margin-bottom: 10px; }
        .camera-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 24px; background-color: #f0fdf4; border: 2px dashed #16a34a; border-radius: 8px; color: #15803d; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">

    <div id="view-login">
        <div class="login-card">
            <div class="text-4xl text-[#007a4d] font-bold mb-6 flex items-center justify-center gap-2"><i class="ph-fill ph-plant"></i> Greenleaf</div>
            <div id="login-buttons">
                <button class="user-btn" onclick="selectUser('Dylan')"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">D</div> Dylan</button>
                <button class="user-btn" onclick="selectUser('Kayla')"><div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-600 font-bold">K</div> Kayla</button>
                <button class="user-btn" onclick="selectUser('Morgan')"><div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold">M</div> Morgan</button>
                <button class="user-btn" onclick="selectUser('J.D.')"><div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-700 font-bold">J</div> J.D.</button>
            </div>
            <div id="pin-container" class="hidden mt-4">
                <input type="password" id="pin-code" class="pin-input" placeholder="PIN" maxlength="4" inputmode="numeric">
                <button class="w-full bg-[#007a4d] text-white font-bold py-3 rounded-lg" onclick="verifyPin()">ENTER</button>
            </div>
            <div id="loading-spinner" class="hidden mt-6 flex flex-col items-center">
                <div class="spinner"></div>
                <div class="text-white font-bold text-sm mt-3">Syncing Server Data...</div>
            </div>
        </div>
    </div>

    <div id="app-wrapper" class="hidden h-full flex flex-col">
        <header class="nav-header sticky top-0 z-50 p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <i class="ph-bold ph-list menu-btn cursor-pointer" onclick="toggleMenu()"></i>
                <div class="font-bold text-lg"><span id="header-user">User</span></div>
            </div>
            <div class="text-xs font-bold opacity-80" id="version-tag">v125</div>
        </header>

        <div id="drawer-overlay" onclick="toggleMenu()"></div>
        <div id="side-drawer">
            <div class="drawer-header">Greenleaf Menu</div>
            <div class="drawer-item" onclick="switchView('home'); toggleMenu();"><i class="ph-bold ph-house"></i> Home</div>
            <div class="drawer-item" onclick="switchView('drive'); toggleMenu();"><i class="ph-bold ph-car"></i> Drive Mode</div>
            <div class="drawer-item" onclick="switchView('viewer'); toggleMenu();"><i class="ph-bold ph-eye"></i> Data Viewer</div>
            <div class="drawer-item" onclick="switchView('tasks'); toggleMenu();"><i class="ph-bold ph-clipboard-text"></i> My Tasks</div>
            <hr>
            <div class="drawer-item text-red-600" onclick="location.reload()"><i class="ph-bold ph-sign-out"></i> Logout</div>
        </div>

        <div id="main-scroll-area" class="flex-grow overflow-y-auto p-4 pb-24">
            <div id="view-home" class="hidden">
                <div class="bg-[#007a4d] text-white p-6 rounded-xl mb-4 shadow-lg">
                    <h1 class="text-2xl font-bold">Greenleaf Pro</h1>
                    <p class="opacity-90">Cloud Inventory System</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="switchView('tasks')" class="bg-white p-6 rounded-xl shadow-sm border flex flex-col items-center gap-2"><i class="ph-bold ph-clipboard-text text-2xl text-[#007a4d]"></i><span class="font-bold">Tasks</span></button>
                    <button onclick="switchView('drive')" class="bg-white p-6 rounded-xl shadow-sm border flex flex-col items-center gap-2"><i class="ph-bold ph-car text-2xl text-blue-600"></i><span class="font-bold">Drive</span></button>
                </div>
            </div>

            <div id="view-drive" class="hidden">
                <input type="text" id="drive-search" class="input-field mb-4" placeholder="Search Plant Names..." onkeyup="renderDriveNames()">
                <div id="drive-content"></div>
            </div>

            <div id="view-tasks" class="hidden">
                <div class="task-tabs mb-4">
                    <div id="ttab-season" class="task-tab active" onclick="setTaskTab('season')">Season</div>
                    <div id="ttab-location" class="task-tab" onclick="setTaskTab('location')">Location</div>
                </div>
                <div id="task-content"></div>
            </div>

            <div id="view-viewer" class="hidden">
                <input type="text" id="viewer-search" class="input-field mb-4" placeholder="Read-Only Search..." onkeyup="renderViewerNames()">
                <div id="viewer-content"></div>
            </div>

            <div id="view-detail" class="hidden">
                <div class="back-btn" onclick="closeDetail()"><i class="ph-bold ph-arrow-left"></i> Back</div>
                <h1 id="det-common" class="text-2xl font-bold text-[#007a4d]">--</h1>
                <p id="det-size" class="text-gray-500 font-bold mb-4">--</p>
                
                <div class="detail-tabs">
                    <div class="detail-tab active" onclick="switchDetailTab('overview')" id="dtab-overview">Overview</div>
                    <div class="detail-tab" onclick="switchDetailTab('actions')" id="dtab-actions">Actions</div>
                </div>

                <div id="det-overview-content" class="py-4">
                    <div id="user-data-box" class="bg-green-50 p-4 rounded-lg border border-green-100 mb-4 hidden">
                        <h3 class="text-[10px] font-bold text-green-800 uppercase mb-2">My Saved Data</h3>
                        <div id="dynamic-user-grid" class="overview-grid"></div>
                    </div>
                    <div class="task-info-grid">
                        <div class="overview-card"><div class="overview-label">Location</div><div id="ov-loc" class="overview-val">--</div></div>
                        <div class="overview-card"><div class="overview-label">Available</div><div id="ov-avail" class="overview-val">--</div></div>
                        <div class="overview-card"><div class="overview-label">Item Code</div><div id="ov-item" class="overview-val">--</div></div>
                        <div class="overview-card"><div class="overview-label">Lot</div><div id="ov-lot" class="overview-val">--</div></div>
                        <div class="overview-card full-width"><div class="overview-label">Sales Note</div><div id="ov-sales" class="overview-val">--</div></div>
                    </div>
                    <div id="expand-section" class="mt-4">
                        <div class="expand-trigger" onclick="toggleExpand()"><span>View All Excel Fields</span><i class="ph-bold ph-caret-down"></i></div>
                        <div id="expand-content" class="expand-content"></div>
                    </div>
                </div>

                <div id="det-actions-content" class="hidden py-4">
                    <label class="camera-btn mb-4"><i class="ph-fill ph-camera text-2xl"></i><span class="font-bold">Photo</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhoto(this)"></label>
                    <input type="number" id="in-match" class="input-field" placeholder="Match %">
                    <input type="text" id="in-spec" class="input-field" placeholder="Spec (e.g. 24-30'')">
                    <input type="text" id="in-pick" class="input-field" placeholder="Pick Note">
                    <textarea id="in-note" class="input-field h-24" placeholder="General Observations..."></textarea>
                    <button class="w-full bg-[#e3a000] text-white font-bold py-4 rounded-lg shadow-md" onclick="saveData()">SAVE UPDATES</button>
                </div>
            </div>
        </div>

        <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around py-3 shadow-lg z-50">
            <div onclick="switchView('home')"><i class="ph-bold ph-house text-2xl text-gray-400"></i></div>
            <div onclick="switchView('drive')"><i class="ph-bold ph-car text-2xl text-gray-400"></i></div>
            <div onclick="switchView('tasks')"><i class="ph-bold ph-clipboard-text text-2xl text-gray-400"></i></div>
            <div onclick="switchView('viewer')"><i class="ph-bold ph-eye text-2xl text-gray-400"></i></div>
        </nav>
    </div>

    <script>
        let fullInventory = [];
        let activeItem = null;
        let currentUser = null;
        let currentTab = 'season';
        const STORAGE_KEY = "greenleaf_v125_storage";

        function selectUser(u) {
            currentUser = u;
            document.getElementById('login-buttons').classList.add('hidden');
            document.getElementById('pin-container').classList.remove('hidden');
            document.getElementById('pin-code').style.display = 'block';
            document.getElementById('pin-code').focus();
        }

        function verifyPin() {
            if (document.getElementById('pin-code').value === '1234') {
                document.getElementById('pin-container').classList.add('hidden');
                document.getElementById('loading-spinner').classList.remove('hidden');
                fetchData();
            } else { alert("Wrong PIN"); }
        }

        async function fetchData() {
            try {
                const res = await fetch('inventory.xlsx?v=' + Date.now());
                const arrayBuffer = await res.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                
                // HEADER SCANNER (ROW 2 FIX)
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                let headerRow = 0;
                for(let i=0; i<Math.min(rows.length, 20); i++){
                    const str = JSON.stringify(rows[i]).toUpperCase();
                    if(str.includes("ITEMCODE") || str.includes("COMMONNAME")) { headerRow = i; break; }
                }
                
                const jsonData = XLSX.utils.sheet_to_json(sheet, { range: headerRow });
                fullInventory = jsonData.map(row => {
                    let obj = {};
                    Object.keys(row).forEach(k => {
                        let cleanK = k.replace(/\s+/g, '').toUpperCase();
                        obj[cleanK] = row[k];
                    });
                    if(!obj.COMMONNAME) obj.COMMONNAME = obj.ITEMCODE || "Unknown";
                    return obj;
                });

                applyAssignments();
                loadSavedData();
                launchApp();
            } catch (e) {
                alert("File Load Failed. Make sure inventory.xlsx is on GitHub.");
            }
        }

        function launchApp() {
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('app-wrapper').classList.remove('hidden');
            document.getElementById('header-user').innerText = currentUser;
            switchView('home');
        }

        function applyAssignments() {
            let i = 0;
            fullInventory.forEach(item => {
                const group = (item.PLANTGROUPCODE || "").toString();
                if(group.includes("230") || group.includes("140")) item.ASSIGNEDTO = "Dylan";
                else if(group.includes("330") || group.includes("300")) item.ASSIGNEDTO = "Kayla";
                else {
                    const weight = i % 5;
                    item.ASSIGNEDTO = weight < 3 ? "Dylan" : (weight === 3 ? "Kayla" : "Morgan");
                    i++;
                }
            });
        }

        // --- DRILL DOWN LOGIC (NAME > SIZE > LOC) ---
        function renderDriveNames() {
            const term = document.getElementById('drive-search').value.toLowerCase();
            const names = [...new Set(fullInventory.map(i => i.COMMONNAME))].filter(n => n.toLowerCase().includes(term)).sort();
            const container = document.getElementById('drive-content');
            container.innerHTML = names.map(n => `<div class="drill-item" onclick="selectDriveName('${n.replace(/'/g, "\\'")}')"><span>${n}</span><i class="ph-bold ph-caret-right"></i></div>`).join('');
        }

        function selectDriveName(name) {
            const sizes = [...new Set(fullInventory.filter(i => i.COMMONNAME === name).map(i => i.CONTSIZE || "N/A"))].sort();
            const container = document.getElementById('drive-content');
            container.innerHTML = `<div class="back-btn" onclick="renderDriveNames()"><i class="ph-bold ph-arrow-left"></i> Back to Names</div>` +
                sizes.map(s => `<div class="drill-item" onclick="selectDriveSize('${name.replace(/'/g, "\\'")}', '${s}')"><span>${s}</span><i class="ph-bold ph-caret-right"></i></div>`).join('');
        }

        function selectDriveSize(name, size) {
            const items = fullInventory.filter(i => i.COMMONNAME === name && (i.CONTSIZE || "N/A") === size);
            const container = document.getElementById('drive-content');
            container.innerHTML = `<div class="back-btn" onclick="selectDriveName('${name.replace(/'/g, "\\")}')"><i class="ph-bold ph-arrow-left"></i> Back to Sizes</div>` +
                items.map(item => {
                    const idx = fullInventory.indexOf(item);
                    return `<div class="inv-card" onclick="openDetail(${idx})">
                        <div class="font-bold text-[#007a4d]">${item.LOCATIONCODE || 'No Loc'}</div>
                        <div class="text-sm">Qty: ${item.PTRAVAILABLE || 0} | Lot: ${item.LOTCODE || '-'}</div>
                    </div>`;
                }).join('');
        }

        // --- TASKS ---
        function setTaskTab(t) {
            currentTab = t;
            document.querySelectorAll('.task-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('ttab-'+t).classList.add('active');
            renderTasks();
        }

        function renderTasks() {
            const items = fullInventory.filter(i => i.ASSIGNEDTO === currentUser);
            const container = document.getElementById('task-content');
            // Simplified task list for assignment focus
            container.innerHTML = items.map(item => {
                const idx = fullInventory.indexOf(item);
                return `<div class="inv-card" onclick="openDetail(${idx})">
                    <div class="font-bold">${item.COMMONNAME}</div>
                    <div class="text-xs text-gray-500">${item.CONTSIZE} • ${item.LOCATIONCODE}</div>
                </div>`;
            }).join('');
        }

        // --- DETAILS & UI ---
        function openDetail(idx) {
            activeItem = fullInventory[idx];
            document.getElementById('view-detail').classList.remove('hidden');
            document.getElementById('view-drive').classList.add('hidden');
            document.getElementById('view-tasks').classList.add('hidden');
            document.getElementById('view-viewer').classList.add('hidden');

            document.getElementById('det-common').innerText = activeItem.COMMONNAME;
            document.getElementById('det-size').innerText = activeItem.CONTSIZE || "--";
            document.getElementById('ov-loc').innerText = activeItem.LOCATIONCODE || "--";
            document.getElementById('ov-avail').innerText = activeItem.PTRAVAILABLE || "0";
            document.getElementById('ov-item').innerText = activeItem.ITEMCODE || "--";
            document.getElementById('ov-lot').innerText = activeItem.LOTCODE || "--";
            document.getElementById('ov-sales').innerText = activeItem.SALESNOTE || "N/A";

            // Inputs
            document.getElementById('in-match').value = activeItem.SAVED_MATCH || "";
            document.getElementById('in-spec').value = activeItem.SAVED_SPEC || "";
            document.getElementById('in-pick').value = activeItem.SAVED_PICK || "";
            document.getElementById('in-note').value = activeItem.SAVED_NOTE || "";

            renderOverviewData();
            renderAllFields();
            switchDetailTab('overview');
        }

        function renderOverviewData() {
            const box = document.getElementById('user-data-box');
            const grid = document.getElementById('dynamic-user-grid');
            let html = "";
            if(activeItem.SAVED_MATCH) html += `<div class="overview-card"><div class="overview-label">Match %</div><div class="overview-val">${activeItem.SAVED_MATCH}%</div></div>`;
            if(activeItem.SAVED_SPEC) html += `<div class="overview-card"><div class="overview-label">Spec</div><div class="overview-val">${activeItem.SAVED_SPEC}</div></div>`;
            if(activeItem.SAVED_PICK) html += `<div class="overview-card full-width"><div class="overview-label">Pick Note</div><div class="overview-val">${activeItem.SAVED_PICK}</div></div>`;
            if(activeItem.SAVED_NOTE) html += `<div class="overview-card full-width"><div class="overview-label">Note</div><div class="overview-val">${activeItem.SAVED_NOTE}</div></div>`;
            
            if(html) { grid.innerHTML = html; box.classList.remove('hidden'); }
            else { box.classList.add('hidden'); }
        }

        function renderAllFields() {
            const container = document.getElementById('expand-content');
            container.innerHTML = Object.keys(activeItem).map(k => {
                if(k.startsWith('SAVED_')) return "";
                return `<div class="dynamic-stack"><div class="dynamic-label">${k}</div><div class="dynamic-val">${activeItem[k] || '-'}</div></div>`;
            }).join('');
        }

        function saveData() {
            activeItem.SAVED_MATCH = document.getElementById('in-match').value;
            activeItem.SAVED_SPEC = document.getElementById('in-spec').value;
            activeItem.SAVED_PICK = document.getElementById('in-pick').value;
            activeItem.SAVED_NOTE = document.getElementById('in-note').value;
            
            const storage = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            const id = activeItem.ITEMCODE + "_" + activeItem.LOCATIONCODE + "_" + activeItem.LOTCODE;
            storage[id] = { m: activeItem.SAVED_MATCH, s: activeItem.SAVED_SPEC, p: activeItem.SAVED_PICK, n: activeItem.SAVED_NOTE, t: Date.now() };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));
            
            alert("Data Saved Locally");
            openDetail(fullInventory.indexOf(activeItem));
        }

        function loadSavedData() {
            const storage = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            fullInventory.forEach(item => {
                const id = item.ITEMCODE + "_" + item.LOCATIONCODE + "_" + item.LOTCODE;
                if(storage[id]) {
                    item.SAVED_MATCH = storage[id].m;
                    item.SAVED_SPEC = storage[id].s;
                    item.SAVED_PICK = storage[id].p;
                    item.SAVED_NOTE = storage[id].n;
                }
            });
        }

        function switchView(v) {
            ['view-home', 'view-drive', 'view-tasks', 'view-viewer', 'view-detail'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            if(v === 'drive') renderDriveNames();
            if(v === 'tasks') renderTasks();
            if(v === 'viewer') renderViewerNames();
        }

        function switchDetailTab(t) {
            document.getElementById('det-overview-content').classList.toggle('hidden', t !== 'overview');
            document.getElementById('det-actions-content').classList.toggle('hidden', t !== 'actions');
            document.getElementById('dtab-overview').classList.toggle('active', t === 'overview');
            document.getElementById('dtab-actions').classList.toggle('active', t === 'actions');
        }

        function closeDetail() { document.getElementById('view-detail').classList.add('hidden'); switchView('drive'); }
        function toggleMenu() { document.getElementById('side-drawer').classList.toggle('open'); document.getElementById('drawer-overlay').classList.toggle('open'); }
        function toggleExpand() { document.getElementById('expand-section').classList.toggle('expanded'); }
    </script>
</body>
</html>
