<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greenleaf Turbo v306 (Safe Mode)</title>
    
    <meta name="theme-color" content="#007a4d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root { --brand-green: #007a4d; --brand-gold: #e3a000; }
        body { font-family: sans-serif; background-color: white; user-select: none; -webkit-tap-highlight-color: transparent; }
        .nav-header { background: var(--brand-green); color: white; padding-top: env(safe-area-inset-top); }
        
        /* Views */
        .view-section { display: none; height: 100vh; overflow-y: auto; padding-bottom: 80px; }
        .view-section.active { display: block; }

        /* Login */
        #view-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--brand-green); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .user-btn { width: 100%; padding: 15px; margin-bottom: 10px; background: white; border-radius: 8px; font-weight: bold; color: #374151; display: flex; align-items: center; gap: 10px; }
        .pin-input { width: 100%; padding: 15px; font-size: 24px; text-align: center; border-radius: 8px; margin-bottom: 20px; outline: none; }

        /* Cards */
        .home-btn { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .inv-card { border-bottom: 1px solid #e5e7eb; padding: 12px; background: white; }
        
        /* Nav */
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); padding-top: 10px; z-index: 40; }
        .nav-item { flex: 1; text-align: center; color: #9ca3af; padding: 5px; }
        .nav-item.active { color: var(--brand-green); font-weight: bold; }
        
        /* Utils */
        .drill-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-weight: bold; }
        .back-btn { padding: 10px; color: #666; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="view-login">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-bold text-[#007a4d] mb-6">Greenleaf v306</h1>
            
            <div id="login-step-1">
                <button class="user-btn" onclick="promptPin('Dylan')">👤 Dylan (Manager)</button>
                <button class="user-btn" onclick="promptPin('J.D.')">👤 J.D. (Manager)</button>
                <button class="user-btn" onclick="promptPin('Kayla')">👤 Kayla</button>
                <button class="user-btn" onclick="promptPin('Morgan')">👤 Morgan</button>
                <button class="text-xs text-red-400 mt-4 underline" onclick="clearCache()">Fix/Reset App</button>
            </div>

            <div id="login-step-2" class="hidden">
                <input type="password" id="pin-input" class="pin-input border-2 border-gray-200" placeholder="PIN" maxlength="4" inputmode="numeric">
                <button class="w-full bg-[#007a4d] text-white font-bold py-3 rounded-lg" onclick="checkPin()">ENTER</button>
                <button class="text-gray-400 text-sm mt-4 underline" onclick="showUsers()">Back</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" class="hidden">
        
        <header class="nav-header sticky top-0 z-40 p-4 shadow-md flex justify-between items-center">
            <div>
                <div class="font-bold text-xl" id="header-user">User</div>
                <div class="text-xs opacity-80">Safe Mode</div>
            </div>
            <button onclick="syncData()" class="bg-white text-[#007a4d] px-4 py-2 rounded-lg font-bold text-xs shadow">SYNC NOW</button>
        </header>

        <div id="view-home" class="view-section active p-4">
            <div class="grid grid-cols-2 gap-4">
                <div onclick="nav('drive')" class="home-btn">
                    <i class="ph-bold ph-car text-3xl text-blue-600"></i>
                    <span class="font-bold">Drive Mode</span>
                    <span id="stat-drive" class="text-xs text-gray-400">0 Items</span>
                </div>
                <div onclick="nav('tasks')" class="home-btn">
                    <i class="ph-bold ph-clipboard-text text-3xl text-[#007a4d]"></i>
                    <span class="font-bold">Tasks</span>
                    <span id="stat-tasks" class="text-xs text-gray-400">0 Items</span>
                </div>
                <div onclick="nav('soc')" class="home-btn">
                    <i class="ph-bold ph-check-square text-3xl text-purple-600"></i>
                    <span class="font-bold">SOC</span>
                    <span id="stat-soc" class="text-xs text-gray-400">0 Items</span>
                </div>
                <div onclick="nav('review')" class="home-btn border-red-200 bg-red-50">
                    <i class="ph-bold ph-warning-circle text-3xl text-red-600"></i>
                    <span class="font-bold text-red-700">Review</span>
                    <span id="stat-review" class="text-xs text-red-400">0 Items</span>
                </div>
            </div>
            <div id="sync-msg" class="mt-6 text-center text-xs font-bold text-gray-400"></div>
        </div>

        <div id="view-drive" class="view-section p-4">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Inventory</h2>
            <input type="text" id="search-drive" class="w-full p-3 border rounded-lg mb-4" placeholder="Search..." onkeyup="renderDrive()">
            <div id="list-drive"></div>
        </div>

        <div id="view-tasks" class="view-section p-4">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-2">My Tasks</h2>
            <div class="flex gap-2 mb-4">
                <button id="btn-season" class="flex-1 py-2 bg-green-100 text-green-800 font-bold rounded" onclick="setTaskTab('season')">Season</button>
                <button id="btn-loc" class="flex-1 py-2 bg-gray-100 text-gray-600 font-bold rounded" onclick="setTaskTab('location')">Location</button>
            </div>
            <div id="list-tasks"></div>
        </div>

        <div id="view-soc" class="view-section p-4">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">SOC</h2>
            <div class="back-btn hidden" id="soc-back" onclick="resetSoc()">Reset</div>
            <div id="list-soc"></div>
        </div>

        <div id="view-review" class="view-section p-4">
            <h2 class="text-sm font-bold text-red-500 uppercase mb-4">Manager Review</h2>
            <div id="list-review"></div>
        </div>

        <nav id="bottom-nav">
            <div onclick="nav('home')" class="nav-item active"><i class="ph-bold ph-house text-2xl"></i><div class="text-[10px]">Home</div></div>
            <div onclick="nav('drive')" class="nav-item"><i class="ph-bold ph-car text-2xl"></i><div class="text-[10px]">Drive</div></div>
            <div onclick="nav('tasks')" class="nav-item"><i class="ph-bold ph-clipboard-text text-2xl"></i><div class="text-[10px]">Tasks</div></div>
        </nav>

    </div>

    <script>
        // *** CONFIGURATION ***
        const API_URL = "https://script.google.com/macros/s/AKfycbyj9l52858cvw_UHAt7et_xsXNS2RYgOzEzpyzGUyoDmxoiArCBstES5bqG4DYWMIPDYg/exec";
        
        let currentUser = "";
        let inventory = [];
        let socData = [];
        let taskTab = 'season';
        
        // *** LOGIN LOGIC ***
        function promptPin(user) {
            currentUser = user;
            document.getElementById('login-step-1').classList.add('hidden');
            document.getElementById('login-step-2').classList.remove('hidden');
            document.getElementById('pin-input').focus();
        }
        function showUsers() {
            document.getElementById('login-step-1').classList.remove('hidden');
            document.getElementById('login-step-2').classList.add('hidden');
            document.getElementById('pin-input').value = "";
        }
        function checkPin() {
            if (document.getElementById('pin-input').value === "1234") {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('app-wrapper').classList.remove('hidden');
                document.getElementById('header-user').innerText = currentUser;
                loadCache(); // Load existing data if any
            } else { alert("Wrong PIN"); }
        }
        function clearCache() {
            localStorage.clear();
            alert("App Reset. Please Sync again.");
            location.reload();
        }

        // *** DATA SYNC (The Critical Part) ***
        async function syncData() {
            const msg = document.getElementById('sync-msg');
            msg.innerText = "Downloading Inventory... (Please Wait)";
            
            try {
                // 1. Get Inventory
                let res = await fetch(API_URL + "?type=inventory");
                let json = await res.json();
                if (json.status === 'success') {
                    inventory = json.data;
                    msg.innerText = "Processing Logic...";
                    
                    // Allow UI to breathe before processing logic
                    setTimeout(() => {
                        runLogic(inventory);
                        localStorage.setItem("gl_inv", JSON.stringify(inventory));
                        updateStats();
                        msg.innerText = "Downloading SOC...";
                        syncSoc();
                    }, 100);
                } else { alert("Inventory Error: " + json.message); msg.innerText = "Error"; }
            } catch (e) { alert("Network Error: " + e); msg.innerText = "Failed"; }
        }

        async function syncSoc() {
            const msg = document.getElementById('sync-msg');
            try {
                let res = await fetch(API_URL + "?type=soc");
                let json = await res.json();
                if (json.status === 'success') {
                    socData = json.data;
                    localStorage.setItem("gl_soc", JSON.stringify(socData));
                    updateStats();
                    msg.innerText = "Sync Complete!";
                    setTimeout(() => { msg.innerText = ""; }, 3000);
                }
            } catch (e) { console.log(e); }
        }

        function loadCache() {
            try {
                let i = localStorage.getItem("gl_inv");
                let s = localStorage.getItem("gl_soc");
                if (i) { inventory = JSON.parse(i); }
                if (s) { socData = JSON.parse(s); }
                updateStats();
            } catch (e) { console.log("Cache error"); }
        }

        // *** 10% LOGIC ENGINE ***
        function runLogic(items) {
            if (!Array.isArray(items)) return;
            
            // Group by Item Code
            let grouped = {};
            items.forEach(i => {
                i.TASK_TAB = null; // Reset
                if (!grouped[i.ITEMCODE]) grouped[i.ITEMCODE] = [];
                grouped[i.ITEMCODE].push(i);
            });

            // Assign Roles
            Object.keys(grouped).forEach(k => {
                let grp = grouped[k];
                // Get rows with Priority
                let candidates = grp.filter(x => x.PRIORITY > 0).sort((a,b) => a.PRIORITY - b.PRIORITY);
                
                if (candidates.length === 0) {
                    grp.forEach(x => x.TASK_TAB = 'review');
                    return;
                }

                let winner = null;
                for (let c of candidates) {
                    let supply = parseFloat(c.SEASONSUPPLY) || 0;
                    let avail = parseFloat(c.PTRAVAILABLE) || 0;
                    if (avail > (supply * 0.10)) {
                        winner = c;
                        break;
                    }
                }

                if (winner) {
                    winner.TASK_TAB = 'season';
                    candidates.forEach(c => { if (c !== winner) c.TASK_TAB = 'location'; });
                } else {
                    candidates.forEach(c => c.TASK_TAB = 'review');
                }
            });
        }

        // *** NAVIGATION ***
        function nav(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            if (viewId === 'drive') renderDrive();
            if (viewId === 'tasks') renderTasks();
            if (viewId === 'soc') renderSoc0();
            if (viewId === 'review') renderReview();
        }

        function updateStats() {
            document.getElementById('stat-drive').innerText = inventory.length + " Items";
            document.getElementById('stat-tasks').innerText = inventory.filter(i => i.TASK_TAB).length + " Tasks";
            document.getElementById('stat-soc').innerText = socData.length + " Rows";
            document.getElementById('stat-review').innerText = inventory.filter(i => i.TASK_TAB === 'review').length + " Flags";
        }

        // *** RENDERERS ***
        
        // 1. Drive (Limit to 50 for speed)
        function renderDrive() {
            const q = document.getElementById('search-drive').value.toLowerCase();
            const list = document.getElementById('list-drive');
            
            let matches = inventory.filter(i => (i.COMMONNAME || "").toLowerCase().includes(q));
            let show = matches.slice(0, 50); // Limit render
            
            list.innerHTML = show.map(i => `
                <div class="inv-card">
                    <div class="font-bold text-[#007a4d]">${i.COMMONNAME}</div>
                    <div class="text-sm">Qty: ${i.PTRAVAILABLE} | Size: ${i.CONTSIZE} | Loc: ${i.LOCATIONCODE}</div>
                </div>
            `).join('');
            
            if (matches.length > 50) list.innerHTML += `<div class="p-4 text-center text-gray-400">...and ${matches.length - 50} more. Keep typing.</div>`;
        }

        // 2. Tasks
        function setTaskTab(t) {
            taskTab = t;
            document.getElementById('btn-season').className = t === 'season' ? "flex-1 py-2 bg-green-100 text-green-800 font-bold rounded" : "flex-1 py-2 bg-gray-100 text-gray-600 font-bold rounded";
            document.getElementById('btn-loc').className = t === 'location' ? "flex-1 py-2 bg-green-100 text-green-800 font-bold rounded" : "flex-1 py-2 bg-gray-100 text-gray-600 font-bold rounded";
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('list-tasks');
            // Filter by Assignment (Simple check for now) & Tab
            let tasks = inventory.filter(i => i.TASK_TAB === taskTab);
            
            // Limit render
            let show = tasks.slice(0, 50);
            
            if (show.length === 0) { list.innerHTML = "<div class='p-4 text-center text-gray-400'>No tasks in this category.</div>"; return; }

            list.innerHTML = show.map(i => `
                <div class="inv-card border-l-4 border-green-500">
                    <div class="font-bold text-gray-800">${i.COMMONNAME}</div>
                    <div class="text-sm text-gray-600">Size: ${i.CONTSIZE} | Loc: ${i.LOCATIONCODE}</div>
                    <div class="text-xs font-bold text-blue-600 mt-1">${i.SALESNOTE || "No Sales Note"}</div>
                </div>
            `).join('');
        }

        // 3. SOC (Simple List)
        function renderSoc0() {
            const list = document.getElementById('list-soc');
            // Unique Reps
            let reps = [...new Set(socData.map(i => i.SALESREPNAME || "Unknown"))].sort();
            list.innerHTML = reps.map(r => `
                <div class="drill-item" onclick="alert('Rep: ${r}')">
                    <span>${r}</span> <i class="ph-bold ph-caret-right"></i>
                </div>
            `).join('');
        }

        // 4. Review
        function renderReview() {
            const list = document.getElementById('list-review');
            let items = inventory.filter(i => i.TASK_TAB === 'review').slice(0, 50);
            if (items.length === 0) { list.innerHTML = "No reviews needed."; return; }
            
            list.innerHTML = items.map(i => `
                <div class="inv-card border-l-4 border-red-500">
                    <div class="font-bold text-red-700">${i.COMMONNAME}</div>
                    <div class="text-xs">Reason: No stock > 10% supply.</div>
                </div>
            `).join('');
        }

    </script>
</body>
</html>
