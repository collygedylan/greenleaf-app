<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greenleaf Debugger v305</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; }
        #debug-console { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 200px; 
            background: black; color: #00ff00; font-family: monospace; font-size: 10px; 
            padding: 10px; overflow-y: scroll; z-index: 9999; border-top: 2px solid #00ff00;
        }
        .btn { background: #007a4d; color: white; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4">

    <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Connection Test</h1>
    
    <button class="btn" onclick="testConnection('inventory')">1. Test Inventory Data</button>
    <button class="btn bg-purple-600" onclick="testConnection('soc')">2. Test SOC Data</button>
    <button class="text-red-500 underline text-center w-full mt-4" onclick="document.getElementById('debug-console').innerHTML=''">Clear Log</button>

    <div id="debug-console">Waiting for user input...<br></div>

    <script>
        // *** PASTE YOUR CURRENT SCRIPT URL HERE ***
        const API_URL = "https://script.google.com/macros/s/AKfycbyj9l52858cvw_UHAt7et_xsXNS2RYgOzEzpyzGUyoDmxoiArCBstES5bqG4DYWMIPDYg/exec";

        function log(msg) {
            const c = document.getElementById('debug-console');
            c.innerHTML += `> ${msg}<br>`;
            c.scrollTop = c.scrollHeight;
            console.log(msg);
        }

        async function testConnection(type) {
            log(`STARTING TEST: ${type.toUpperCase()}...`);
            log(`Target URL: ${API_URL}`);
            
            try {
                const response = await fetch(`${API_URL}?type=${type}`);
                log(`Response Status: ${response.status}`);
                
                if (response.status !== 200) {
                    log("CRITICAL ERROR: Server refused connection.");
                    return;
                }

                const text = await response.text();
                log(`Raw Data Length: ${text.length} characters`);
                
                try {
                    const json = JSON.parse(text);
                    log(`API Status: ${json.status}`);
                    
                    if (json.status === 'error') {
                        log(`SERVER ERROR MESSAGE: ${json.message}`);
                    } else if (json.data) {
                        log(`SUCCESS! Found ${json.data.length} items.`);
                        if (json.data.length > 0) {
                            log(`Sample Item 1: ${JSON.stringify(json.data[0]).substring(0, 100)}...`);
                        } else {
                            log("WARNING: Data array is empty (Sheet might be blank?)");
                        }
                    } else {
                        log("ERROR: Invalid JSON structure received.");
                    }
                } catch (e) {
                    log(`JSON PARSE ERROR: Could not read data. Is it HTML?`);
                    log(`Snippet: ${text.substring(0, 100)}`);
                }

            } catch (e) {
                log(`NETWORK ERROR: ${e.toString()}`);
                log("Possible causes: CORS, Offline, Wrong URL.");
            }
            log("--- TEST END ---");
        }
    </script>
</body>
</html>
