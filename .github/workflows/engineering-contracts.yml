name: Mandatory engineering contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject engineering regressions against the event base
        run: node scripts/anti-spaghetti-lock.mjs
      - name: Prove negative cases and safe counterexamples
        run: node --test tests/anti-spaghetti-lock.test.mjs
